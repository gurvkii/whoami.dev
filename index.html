<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Birthstone&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <title>Who Am I?</title>
    <script>
        if (localStorage.getItem("cemetery_auth") !== "true") {
            window.location.href = "pages/login_signup/auth.html";
        }
    </script>
</head>

<body>
    <nav class="nav">
        <button id="logoutBtn">Logout</button>
    </nav>

    <div class="main">
        <div class="cards-grid">
            <div class="card-container" id="grave-card">
                <div class="upper-container">
                    <div class="image-container">
                        <img src="assets/img/grave.png" alt="Grave">
                    </div>
                </div>
                <div class="lower-container">
                    <span class="field-tag">MEMORIAL</span>
                    <h3>Digital Cemetery</h3>
                    <h4>Rest In Pixels</h4>
                    <p>Leave tributes, view resting places, and preserve internet memories in peace.</p>
                    <a href="pages/digital_cementry/grave.html" class="card-btn">Enter Gates</a>
                </div>
            </div>


        </div>
    </div>

    <script>
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                localStorage.removeItem("cemetery_auth");
                window.location.href = "pages/login_signup/auth.html";
            });
        }
    </script>
</body>

</html>
