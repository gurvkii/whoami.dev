<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Birthstone&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <title>Who Am I?</title>
    <script>
        if (localStorage.getItem("cemetery_auth") !== "true") {
            window.location.href = "pages/login_signup/auth.html";
        }
    </script>
</head>

<body>
    <nav class="nav">
        <button id="logoutBtn">Logout</button>
    </nav>


    <script>
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                localStorage.removeItem("cemetery_auth");
                window.location.href = "pages/login_signup/auth.html";
            });
        }
    </script>
</body>

</html>
