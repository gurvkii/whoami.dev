<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grave.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Birthstone&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <title>CEMETERY</title>
    <link rel="icon" href="../../assets/img/gruvkii_whoami.png">
</head>

<body>

    <img src="../../assets/img/hand.png" alt="hand" class="hang-hand-1">

    <img src="../../assets/img/hand.png" alt="hand" class="hang-hand-2">
    <main>
        <div class="nav">
            <h1>DIGITAL CEMETERY</h1>
            <div class="audio-controller">
                <audio id="bgMusic" loop autoplay>
                    <source src="../../assets/mp3/spooky_audio.mp3"  >
                </audio>
                <button id="musicBtn" type="button">⏸</button>
            </div>

        </div>
        <div class="cemetery" id="cemetery">
        </div>
        <div class="cemetery-controls">
            <a href="../../index.html" id="homeBtn">Home</a>
            <button class="addBtn" id="addBtn">Add Grave</button>
            <button id="clearStorage">Clear Graves</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </main>

    <dialog id="addform">
        <form method="dialog" id="graveForm">

            <label for="graveName">Name</label>
            <input id="graveName" type="text" required autocomplete="off">

            <label for="graveDeathDate">Death Date</label>
            <input id="graveDeathDate" type="date" autocomplete="off">

            <label for="graveEpitaph">Epitaph</label>
            <input id="graveEpitaph" type="text" autocomplete="off">

            <label for="graveDescription">Description</label>
            <textarea id="graveDescription"></textarea>
            <label for="graveIMG">Image URL</label>
            <input id="graveIMG" type="url" placeholder="https://example.com/image.jpg" autocomplete="off">
            <div class="form_btns">
                <button type="submit">Add</button>
                <button type="button" id="closeBtn">Cancel</button>
            </div>

        </form>
    </dialog>

    <dialog id="graveDialog">
        <div class="dialog-card">
            <h2 id="dialogName"></h2>
            <img src="" alt="" id="dialogIMG">
            <p id="dialogDate"></p>
            <p id="dialogDesc"></p>
            <p id="dialogEpitaph"></p>
            <button id="closeDialog">Close</button>
        </div>
    </dialog>

    <img src="../../assets/img/pumpkin.png" alt="pumpkin-1" class="pumpkin-1">
    <img src="../../assets/img/pumpkin.png" alt="pumpkin-2" class="pumpkin-2">
    <script src="grave.js"></script>
</body>

</html>
