<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grave.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Birthstone&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <title>CEMETERY</title>
</head>

<body>
    <!-- 
├── id
├── name
├── birthDate
├── deathDate
├── epitaph
├── causeOfDeath
├── description
├── image
└── createdAt
 -->
    <main>
        <div class="nav">
            <h1>DIGITAL CEMETERY</h1>
        </div>
        <div class="cemetery" id="cemetery">
        </div>
        <button class="addBtn" id="addBtn">Add Grave</button>
        <button id="clearStorage">Clear Local Storage</button>
    </main>

    <dialog id="addform">
        <form method="dialog" id="graveForm">

            <label for="graveName">Name</label>
            <input id="graveName" type="text">

            <label for="graveDeathDate">Death Date</label>
            <input id="graveDeathDate" type="date">

            <label for="graveEpitaph">Epitaph</label>
            <input id="graveEpitaph" type="text">

            <label for="graveDescription">Description</label>
            <textarea id="graveDescription"></textarea>
            <!-- 
            <label for="graveImage">Upload Image</label>
            <input id="graveImage" type="file" accept="image/*"> -->

            <div class="form_btns">
                <button type="submit">Add</button>
                <button type="button" id="closeBtn">Cancel</button>
            </div>

        </form>
    </dialog>

    <dialog id="graveDialog">

        <div class="dialog-card">
            <h2 id="dialogName"></h2>
            <p id="dialogDate"></p>
            <p id="dialogEpitaph"></p>

            <button id="closeDialog">Close</button>
        </div>

    </dialog>
    <script src="grave.js"></script>
</body>

</html>
